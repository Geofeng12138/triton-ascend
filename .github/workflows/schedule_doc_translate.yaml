name: Auto Doc Translate

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'
        type: string
      full_translate:
        description: 'Full translation: translate ALL docs (excluding python-api,triton_api,triton_api_extension,libdevice)'
        required: false
        default: false
        type: boolean
      api_base:
        description: 'LLM API base URL. Leave empty to use the default (Volcengine glm-5.2). When set, LLM_API_KEY secret is used instead of TRANSLATION_ASCEND.'
        required: false
        default: ''
        type: string
      model:
        description: 'LLM model name. Leave empty to use the default (glm-5.2). When set, LLM_API_KEY secret is used instead of TRANSLATION_ASCEND.'
        required: false
        default: ''
        type: string

concurrency:
  group: translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
    steps:
      # Resolve the git token for checkout / push / PR creation.
      # PAT_TOKEN is preferred so that the auto-translation PR can trigger CI
      # workflows (GITHUB_TOKEN-created PRs do not trigger downstream workflows).
      # When PAT_TOKEN is not configured, fall back to GITHUB_TOKEN.
      #
      # NOTE: The GITHUB_TOKEN value is passed via the env variable
      # JOB_TOKEN (not "GITHUB_TOKEN") because GitHub Actions automatically
      # injects GITHUB_TOKEN into the environment and can shadow our
      # assignment, causing checkout to receive an empty token.
      - name: Resolve Git token (PAT when configured, else GITHUB_TOKEN)
        id: resolve_token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            echo "token=${PAT_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "GH_TOKEN=${PAT_TOKEN}" >> "$GITHUB_ENV"
            echo "Using PAT_TOKEN for git authentication"
          else
            echo "token=${JOB_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "GH_TOKEN=${JOB_TOKEN}" >> "$GITHUB_ENV"
            echo "PAT_TOKEN not configured; using GITHUB_TOKEN"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.resolve_token.outputs.token }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install openai -r docs/zh/requirement.txt

      - name: Clean stale locale files for full translation
        if: inputs.full_translate
        run: |
          echo "Cleaning old locale files to force full retranslation..."
          rm -rf docs/locale/
          rm -rf locale/
          echo "Cleaned."

      - name: Detect whether to translate
        id: detect
        run: |
          # Determine mode: full translation or incremental
          if [ "${{ inputs.full_translate }}" = "true" ]; then
            echo "Full translation mode"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=true" >> $GITHUB_OUTPUT
          elif { [ -d "docs/locale/en/LC_MESSAGES" ] && [ "$(find docs/locale/en/LC_MESSAGES/ -name '*.po' 2>/dev/null | wc -l)" -gt 0 ]; } || \
               { [ -d "locale/en/LC_MESSAGES" ] && [ "$(find locale/en/LC_MESSAGES/ -name '*.po' 2>/dev/null | wc -l)" -gt 0 ]; }; then
            echo "Incremental mode: will detect changes via sphinx-build -b gettext"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=false" >> $GITHUB_OUTPUT
          else
            echo "No existing .po files — performing full translation"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=true" >> $GITHUB_OUTPUT
          fi

      - name: Translate via LLM API
        if: steps.detect.outputs.has_changes == 'true'
        env:
          # TRANSLATION_ASCEND stores the Volcengine glm-5.2 API key (default provider).
          # LLM_API_KEY is used when api_base/model are overridden via the Actions UI.
          TRANSLATION_ASCEND: ${{ secrets.TRANSLATION_ASCEND }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ inputs.api_base }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          # Key selection:
          #   - Default path (no manual override): use TRANSLATION_ASCEND (Volcengine glm-5.2).
          #   - Override path (api_base/model set in Actions UI): use LLM_API_KEY.
          if [ -z "${LLM_API_BASE}" ] && [ -z "${LLM_MODEL}" ]; then
            API_KEY="${TRANSLATION_ASCEND}"
            echo "Using default provider (Volcengine glm-5.2) with TRANSLATION_ASCEND key"
          else
            API_KEY="${LLM_API_KEY}"
            echo "Using override provider (api_base=${LLM_API_BASE}, model=${LLM_MODEL}) with LLM_API_KEY"
          fi

          if [ -z "${API_KEY}" ]; then
            echo "::error::No LLM API key available. Set TRANSLATION_ASCEND (default) or LLM_API_KEY (override) in repo secrets."
            exit 1
          fi

          if [ "${{ steps.detect.outputs.full_translate }}" = "true" ]; then
            python .github/workflows/scripts/translate_md.py \
              --api-key "${API_KEY}" \
              --first-time \
              --output-json /tmp/translation_results.json
          else
            python .github/workflows/scripts/translate_md.py \
              --api-key "${API_KEY}" \
              --all \
              --output-json /tmp/translation_results.json
          fi

      - name: Process translated files
        if: steps.detect.outputs.has_changes == 'true'
        id: results
        run: |
          if [ ! -f /tmp/translation_results.json ]; then
            echo "No translation results found"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          success_files=$(python3 -c "
          import json
          with open('/tmp/translation_results.json') as f:
              data = json.load(f)
          for p in data.get('success_files', []):
              print(p)
          ")

          if [ -z "$success_files" ]; then
            echo "No files were successfully translated - nothing to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          count=0
          file_list=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              count=$((count + 1))
              file_list="${file_list}- <code>${file}</code>"$'\n'
              git add "$file"
            fi
          done <<< "$success_files"

          [ $count -eq 0 ] && echo "No files to commit" && echo "has_changes=false" >> $GITHUB_OUTPUT && exit 0
          echo "Staged $count translated .po file(s)"
          {
            echo "has_changes=true"
            echo "file_count=$count"
            echo "file_list<<EOF"
            echo "$file_list"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create branch and commit
        if: steps.results.outputs.has_changes == 'true'
        env:
          PUSH_TOKEN: ${{ steps.resolve_token.outputs.token }}
        run: |
          git diff --cached --quiet && echo "Nothing to commit" && exit 1

          BRANCH_NAME="auto-pr/doc-translate-$(date +%Y%m%d%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -b "${BRANCH_NAME}"

          count=$(git diff --cached --name-only | wc -l)
          git commit -s -m "[doc](feat) Auto-translate ${count} file(s) (Sphinx gettext)"

          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${BRANCH_NAME}"

      - name: Create Pull Request
        if: steps.results.outputs.has_changes == 'true'
        env:
          FILE_LIST: ${{ steps.results.outputs.file_list }}
          FILE_COUNT: ${{ steps.results.outputs.file_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_HEAD: ${{ github.repository_owner }}:${{ env.BRANCH_NAME }}
          PR_BASE: ${{ env.TARGET_BRANCH }}
          GH_TOKEN: ${{ steps.resolve_token.outputs.token }}
        run: |
          if [ -z "${{ env.BRANCH_NAME }}" ]; then
            echo "Error: BRANCH_NAME not set"
            exit 1
          fi

          DATE=$(date +%Y-%m-%d)
          # PR title must match: [<component>](<type>) <subject>
          # Allowed types: feat | fix | NFC | style | test | chore | revert
          # Max length: 72 chars
          TITLE="[doc](feat) Auto-translate Chinese docs to English ${DATE}"

          BODY=$(cat <<-BODYEOF
          ## Auto-Translation Summary

          Translated **${FILE_COUNT}** gettext .po file(s):

          ${FILE_LIST}

          This PR uses the **direct doc translation workflow**:
          - Scans \`docs/zh/\` for Chinese source files (.md, .rst)
          - Translates them via LLM API into \`locale/en/LC_MESSAGES/\` preserving directory structure
          - Read the Docs builds English docs using \`docs/conf_en.py\` with \`language=en\`

          ---

          [Workflow run](${RUN_URL})

          > This PR was automatically generated by the scheduled doc translation workflow.
          BODYEOF
          )

          if gh pr create \
            --base "${PR_BASE}" \
            --head "${PR_HEAD}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            --repo "${{ github.repository }}" 2>&1; then
            echo "Pull request created successfully"
          else
            echo "::warning::gh pr create failed (a PR may already exist for ${PR_HEAD}, or the token lacks pull-requests write permission)"
          fi
